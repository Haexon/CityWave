<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — CityWave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="brand">CityWave</a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="team.html">Team</a></li>
      <li><a href="contact.html" aria-current="page">Contact</a></li>
    </ul>
  </div>
</nav>

<header class="hero" style="padding-bottom:2rem;">
  <div class="container" style="grid-template-columns:1fr;">
    <div>
      <span class="eyebrow">Contact</span>
      <h1>Get in touch.</h1>
      <p class="lede">Questions about a pilot deployment, inquiry about products, or press — reach out below.</p>
    </div>
  </div>
</header>

<section>
  <div class="container split">
    <div>
      <h3>Direct</h3>
      <p style="color:var(--slate);">hello@CityWave.example<br>Singapore</p>
    </div>
    <form class="contact-form">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="justify-self:start; background:var(--accent); color:var(--ink);">Send message</button>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div>
      <p style="margin:0; color:#fff; font-family:var(--font-display); font-size:1.1rem;">CityWave</p>
      <p style="margin:0.3rem 0 0;">Singapore · NTU Collaboration</p>
    </div>
    <ul class="footer-links">
      <li><a href="about.html">About</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
